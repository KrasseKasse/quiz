/* Host-Spieleverwaltung */
.member{flex-wrap:wrap}.member-name{min-width:0;flex:1;overflow-wrap:anywhere}
.member-admin{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.member-admin button{background:#ffffff13;border:1px solid #ffffff35;border-radius:8px;color:#f3ecff;padding:6px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.member-admin button:hover{background:#ffffff2d}
.member-admin .kick{border-color:#c65a70;color:#ffc2cf}
.member-admin button:disabled{opacity:.4}
.team-manage{padding:20px;margin-top:18px}
.team-manage h3{font:700 19px 'Space Grotesk';margin:0 0 8px}
.team-manage .team-card{min-height:0}
@media(max-width:620px){.member-admin{width:100%;justify-content:flex-start;margin-left:0;padding-left:35px}.member-admin button{flex:1}}


/* Profile flag thumbnails and player cards */
.flag-pic{display:inline-flex;position:relative;align-items:center;justify-content:center;width:62px;height:45px;flex:none;overflow:hidden;border-radius:10px;background:#191930;border:1px solid #655f83;vertical-align:middle;box-shadow:0 2px 7px #0004}
.flag-pic img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1;display:block}
.flag-fallback{position:absolute;color:#cbc3e6;font-weight:800;font-size:12px;letter-spacing:.6px}
.flag-pic.small{width:44px;height:33px;border-radius:8px}.flag-pic.large{width:110px;height:77px;border-radius:13px}.flag-pic.profile-thumb{width:37px;height:27px;border-radius:6px}
.profile-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.profile-toggle{border:1px solid #6d5d9e;background:#33294f;color:#f5f0ff;display:flex;align-items:center;gap:10px;border-radius:14px;padding:7px 11px;font-weight:800;min-height:47px}
.profile-toggle:hover{background:#44335f}.profile-toggle .profile-name{max-width:145px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.profile-toggle .edit-glyph{font-size:15px;color:#b9aaff}
.profile-layer{position:fixed;inset:0;z-index:1000;background:#05030cb8;display:flex;align-items:flex-start;justify-content:flex-end;padding:80px 25px 24px;overflow:auto}
.profile-layer[hidden]{display:none}
.profile-popover{width:min(500px,100%);max-height:calc(100vh - 103px);overflow:auto;background:linear-gradient(165deg,#2d294b,#1e1b34);border:1px solid #706297;border-radius:23px;box-shadow:0 28px 100px #000b;padding:23px}
.profile-titleline{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px}.profile-titleline h2{margin:0;font:700 23px 'Space Grotesk'}.profile-titleline button{font-size:19px;width:38px;height:38px;border-radius:10px}
.profile-banner{display:flex;align-items:center;gap:16px;background:#19172b;border:1px solid #4c436d;border-radius:16px;padding:13px;margin-bottom:17px}
.profile-banner strong{display:block;font-size:15px}.profile-banner .sub{font-size:12px}
.flag-tools{display:flex;gap:9px;align-items:center;margin:10px 0}
.flag-tools input{flex:1}.flag-picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;max-height:285px;overflow:auto;padding:4px 3px 6px}
.flag-option{color:#eeeaff;background:#24223c;border:1px solid #494363;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;min-width:0;min-height:85px}
.flag-option:hover{background:#37304f}.flag-option.selected{background:#413267;border-color:#c6aaff;outline:2px solid #ad91ff}
.flag-option .flag-pic{width:56px;height:38px}.flag-name{font-size:10px;font-weight:700;text-align:center;max-width:100%;overflow-wrap:anywhere;line-height:1.3}
.profile-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.profile-actions button{flex:1}
.profile-footer{border-top:1px solid #514767;margin-top:15px;padding-top:14px;display:grid;gap:7px}.profile-footer .ghost{text-align:left}.profile-name-count{float:right;color:#a99ec3;font-size:11px}
/* Bigger readable lobby player name tags */
.lobby-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,.75fr);gap:18px}
.lobby-grid .team-card{padding:16px;min-width:0}
.lobby-grid .member,.team-manage .member{padding:13px 12px;border:1px solid #ffffff20;background:#161629bd;min-height:72px;border-radius:14px;align-items:center;flex-wrap:wrap;gap:11px}
.lobby-grid .member-name,.team-manage .member-name{min-width:130px;flex:1 1 130px;display:grid;gap:4px}
.lobby-grid .member-name strong,.team-manage .member-name strong{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;font-size:15px;line-height:1.32}
.lobby-grid .member-admin,.team-manage .member-admin{display:flex;gap:7px;flex:1 1 100%;margin-left:0;flex-wrap:wrap}
.lobby-grid .member-admin button,.team-manage .member-admin button{border:1px solid #625783;background:#352e50;color:#fff;border-radius:9px;padding:9px 11px;font-weight:700;font-size:12px}
.lobby-grid .member-admin .kick,.team-manage .member-admin .kick{background:#542b40;border-color:#84516b}
.member-name{min-width:0}.member-name .small{font-size:12px;color:var(--muted)}
.side-player{display:flex;align-items:center;gap:10px;background:#11122470;border:1px solid #ffffff0c;border-radius:14px;padding:10px 11px;margin-top:10px}
.side-player.active-turn{border:1px solid #dfccff;box-shadow:0 0 0 1px #ffffff30 inset}
.side-player-meta{min-width:0;flex:1}.side-player-name{display:block;overflow-wrap:anywhere;font-size:13px;font-weight:800;line-height:1.35}
.side-role{font-size:11px;color:#d4c9ff;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-top:5px}
.team-side{padding:16px;position:sticky;top:14px}.team-side.red{border-color:#8d4458;background:linear-gradient(160deg,#412335,#201e37)}.team-side.blue{border-color:#3e6696;background:linear-gradient(160deg,#21395d,#1f1f38)}
.team-side .team-title{justify-content:space-between;flex-wrap:wrap}.team-side .sub{margin-top:4px}.turn-chip{display:inline-flex;align-items:center;border-radius:999px;background:#453359;color:#fff;font-size:11px;padding:5px 8px}
.team-shell{display:grid;grid-template-columns:205px minmax(0,1fr) 205px;gap:16px;align-items:start}.center-stack{min-width:0}.game-layout{max-width:none;width:100%}

@media(max-width:690px){.shell{padding:16px 14px 55px}.topbar{margin-bottom:34px}.topbar .tag{display:none}.profile-toggle .profile-name{max-width:85px}.profile-layer{padding:63px 9px 12px}.profile-popover{max-height:calc(100vh - 75px);padding:16px}.flag-picker{grid-template-columns:repeat(3,minmax(0,1fr))}.team-grid,.home-grid{grid-template-columns:1fr}.profile-head{gap:5px}}

<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div id="app" aria-live="polite"><main style="margin:60px auto;max-width:700px;padding:25px;text-align:center"><h1>SKALA</h1><p>Lade das Spiel …</p></main></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="profile-layer" class="profile-layer" hidden role="presentation"></div>
  <noscript>Bitte aktiviere JavaScript in deinem Browser, um SKALA zu spielen.</noscript>
  <!-- Optional für echte Online-Räume; die Offline-Demo braucht die Datei nicht. -->
  <script src="firebase-config.js"></script>
  <script>
// Die Datei ist absichtlich KEIN ES-Modul, damit ein Doppelklick auf index.html funktioniert.
// Firebase wird erst geladen, wenn jemand echte Online-Räume verwendet.
const firebaseConfig = window.SKALA_FIREBASE_CONFIG || {};
const firebaseConfigured = !!(
  firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('HIER_') &&
  firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes('HIER_') &&
  firebaseConfig.appId && !firebaseConfig.appId.includes('HIER_')
);
let clientPromise;
async function getFirebase() {
  if (!firebaseConfigured) throw new Error('Der Mehrspielermodus ist noch nicht eingerichtet. Siehe ANLEITUNG.md.');
  if (!clientPromise) {
    clientPromise = (async () => {
      const [{ initializeApp }, authSdk, dbSdk] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js')
      ]);
      const app = initializeApp(firebaseConfig);
      const auth = authSdk.getAuth(app);
      if (!auth.currentUser) await authSdk.signInAnonymously(auth);
      const db = dbSdk.getDatabase(app);
      return { auth, db, sdk: dbSdk };
    })().catch(err => { clientPromise = null; throw err; });
  }
  return clientPromise;
}

function previewPlayers(room) {
  const people=roomPlayers(room).map(p=>({...p}));
  let r=people.filter(p=>p.team==='red').length, b=people.filter(p=>p.team==='blue').length;
  for(const p of people){if(p.team!=='red'&&p.team!=='blue'){p.team=r<=b?'red':'blue';if(p.team==='red')r++;else b++;}}
  for(const team of ['red','blue']){
    const members=people.filter(p=>p.team===team).sort((a,b)=>((a.slot??9999)-(b.slot??9999)) || (a.joinedAt||0)-(b.joinedAt||0));
    members.forEach((p,i)=>p.slot=i);
  }
  return people;
}

function pickCategory(room, lastId) {

  const selection=ids.filter(id=>id!==lastId);
  const options=selection.length?selection:ids;
  return options[Math.floor(Math.random()*options.length)];
}

function shuffle(list) {const a=[...list];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

}

async function startGame() {

async function advanceRound() {

async function skipStuckRound() {

async function movePlayer(uid,target) {
  const room=state.room;
  if(!isHost()||!room?.players?.[uid]||!['red','blue'].includes(target)||room.status==='finished')return;
  if(room.status==='playing' && room.turn?.chooserId===uid)throw new Error('Warte, bis der Hinweisgeber seine Runde beendet hat.');
  const people=previewPlayers(room);
  const moving=people.find(p=>p.id===uid);
  if(!moving||moving.team===target)return;
  const other=people.filter(p=>p.id!==uid);
  const currentMembers=other.filter(p=>p.team===target).sort((a,b)=>a.slot-b.slot);
  moving.team=target;
  // Verschobener Spieler kommt an das Ende seines neuen Teams.
  const ordered=[...other.filter(p=>p.team==='red').sort((a,b)=>a.slot-b.slot),...other.filter(p=>p.team==='blue').sort((a,b)=>a.slot-b.slot),moving];
  for(const team of ['red','blue']) ordered.filter(p=>p.team===team).forEach((p,i)=>p.slot=i);

  } else {
    const {db,sdk}=state.onlineClient,updates={manualTeams:true};
    for(const p of ordered){updates[`players/${p.id}/team`]=p.team;updates[`players/${p.id}/slot`]=p.slot;}
    await sdk.update(sdk.ref(db,`rooms/${state.code}`),updates);

async function kickPlayer(uid) {

  if(room.status==='playing') {
    if(room.turn?.chooserId===uid)throw new Error('Warte, bis der Hinweisgeber seine Runde beendet hat.');

async function sendClue(word){const t=state.room?.turn;if(!isChooser()||t.clue||!Number.isInteger(state.privateValue))return;
 if(state.mode==='demo'){t.clue=word;render();}
 else{const {db,sdk}=state.onlineClient;await sdk.set(sdk.ref(db,`rooms/${state.code}/turn/clue`),word);}}
async function sendGuess(number){const t=state.room?.turn;if(!t||!t.clue||t.guess||!myPlayer()||myPlayer().team!==t.team||isChooser())return;
 if(!Number.isInteger(number)||number<1||number>10)return;
 if(state.mode==='demo'){t.guess=number;state.selectedGuess=null;const secret=state.demoSecrets[t.id];if(Number.isInteger(secret))t.target=secret;render();}
 else{const {db,sdk}=state.onlineClient;await sdk.set(sdk.ref(db,`rooms/${state.code}/turn/guess`),number);state.selectedGuess=null;}}
function syncPrivateDemo(){
  if(state.mode!=='demo'||state.room?.status!=='playing'||!state.room.turn)return;
  const t=state.room.turn;
  if(!state.demoSecrets[t.id])state.demoSecrets[t.id]=randomNumber();
  state.privateValue=isChooser()?state.demoSecrets[t.id]:null;state.privateRoundId=t.id;
  if(Number.isInteger(t.guess)&&!Number.isInteger(t.target)){t.target=state.demoSecrets[t.id];}
  render();
}
async function rescueRound(roundId) {
  // This fallback never starts or changes a round. It only completes a submitted guess.
  const room=state.room;
  if(state.mode!=='online'||!isHost()||room?.status!=='playing'||room.turn?.id!==roundId ||
     !Number.isInteger(room.turn.guess)||Number.isInteger(room.turn.target))return;
  const {db,sdk}=state.onlineClient;
  const turnRef=sdk.ref(db,`rooms/${state.code}/turn`);
  try {
    const secretSnapshot=await sdk.get(sdk.ref(db,`secrets/${state.code}/${roundId}`));
    const number=secretSnapshot.val()?.number;
    if(!Number.isInteger(number)) {
      showToast('Die geheime Zahl fehlt. Der Hinweisgeber muss die Seite neu laden.');
      return;
    }
    const fresh=(await sdk.get(turnRef)).val();
    if(fresh?.id!==roundId||!Number.isInteger(fresh.guess)||Number.isInteger(fresh.target))return;
    await sdk.set(sdk.ref(db,`rooms/${state.code}/turn/target`),number);
  } catch(e) {
    // If the clue giver revealed the number at the same time, that is NOT an error.
    try {
      const latest=(await sdk.get(turnRef)).val();
      if(latest?.id!==roundId || Number.isInteger(latest?.target))return;
    }catch(_ignored){}
    console.error('Rundenauflösung fehlgeschlagen:',e);
    showToast('Auflösen fehlgeschlagen: '+errMessage(e));
  }
}
async function syncPrivateOnline(force=false){
  const t=state.room?.turn;
  if(state.mode!=='online'||!t||state.room.status!=='playing'||!isChooser()||Number.isInteger(t.target))return;
  const {db,sdk}=state.onlineClient;
  if(force){state.loadedSecretFor='';state.secretError='';clearTimeout(state.secretTimer);}
  if(state.loadedSecretFor!==t.id){
    state.loadedSecretFor=t.id;
    state.privateValue=null;state.privateRoundId='';state.secretError='';
    state.secretStartedAt=Date.now();state.secretRetryCount++;
    const token=++state.secretToken;
    clearTimeout(state.secretTimer);
    state.secretTimer=setTimeout(()=>{
      if(state.secretToken===token && !Number.isInteger(state.privateValue) && state.room?.turn?.id===t.id){
        state.secretError='Firebase antwortet nicht. Klicke auf „Zahl erneut laden“. Falls das nicht hilft, prüfe die Realtime-Database-Regeln.';
        render();
      }
    },10000);
    try {
      const secretRef=sdk.ref(db,`secrets/${state.code}/${t.id}`);
      const existing=await sdk.get(secretRef);
      if(token!==state.secretToken)return;
      let secret=existing.val();
      if(!existing.exists()){
        const result=await sdk.runTransaction(secretRef,current=>current===null?{chooserId:state.me,number:randomNumber()}:undefined,{applyLocally:false});
        if(token!==state.secretToken)return;
        secret=result.snapshot.val();
      }
      if(!Number.isInteger(secret?.number))throw new Error('Firebase hat keine gültige Zahl zurückgegeben.');
      if(state.room?.turn?.id!==t.id||token!==state.secretToken)return;
      state.privateValue=secret.number;state.privateRoundId=t.id;state.secretError='';
      clearTimeout(state.secretTimer);render();
    } catch(e) {
      if(token!==state.secretToken)return;
      clearTimeout(state.secretTimer);
      state.loadedSecretFor='';
      state.secretError='Fehler beim Laden: '+errMessage(e);
      console.error('SKALA geheime Zahl:',e);
      render();
      // Retry once automatically for transient network hiccups; permanent Firebase
      // rule failures stay visible rather than getting hidden behind a spinner.
      const txt=String(e?.message||e).toLowerCase();
      if(state.secretRetryCount<2 && !txt.includes('permission')) {
        state.secretTimer=setTimeout(()=>{if(state.room?.turn?.id===t.id&&isChooser()&&!Number.isInteger(state.privateValue))void syncPrivateOnline(true);},3500);
      }
      return;
    }
  }
  if(state.room?.turn?.id===t.id && Number.isInteger(state.privateValue) && Number.isInteger(state.room.turn.guess) && !Number.isInteger(state.room.turn.target)) {
    try {await sdk.set(sdk.ref(db,`rooms/${state.code}/turn/target`),state.privateValue);}
    catch(e){showToast('Auflösen fehlgeschlagen: '+errMessage(e));}
  }
}

function attachRoom(code, client){
  if(state.unsubscribe)state.unsubscribe();clearRoundUi();state.mode='online';state.code=code;state.onlineClient=client;state.me=client.auth.currentUser.uid;
  const {db,sdk}=client;
  state.unsubscribe=sdk.onValue(sdk.ref(db,`rooms/${code}`),snapshot=>{
    const room=snapshot.val();if(!room){showToast('Dieser Raum existiert nicht mehr.');leaveRoom();return;}
    if(!room.players?.[state.me]){const kicked=!!room.kicked?.[state.me];leaveRoom();showToast(kicked?'Der Host hat dich aus diesem Raum gekickt.':'Du bist nicht mehr Mitglied dieses Raums.');return;}
    const lastId=state.room?.turn?.id;
    state.room=room;
    if(lastId!==room.turn?.id){clearRoundUi();}
    render();
    if(isChooser()) void syncPrivateOnline();
  },error=>showToast(errMessage(error)));
  localStorage.setItem('skala_room',code);
  history.replaceState(null,'',`${location.pathname}?room=${encodeURIComponent(code)}`);
}
async function createOnline(name,flag){
  const client=await getFirebase();const {auth,db,sdk}=client, uid=auth.currentUser.uid;
  for(let attempt=0;attempt<5;attempt++){
    const code=randomCode(),ref=sdk.ref(db,`rooms/${code}`);
    const room={hostId:uid,createdAt:Date.now(),status:'lobby',roundLimit:12,manualTeams:false,players:{[uid]:{name,joinedAt:Date.now(),flag:flagCode(flag)||'de'}},categories:Object.fromEntries(PRESETS.map((c,i)=>[`c${i+1}`,{name:c[0],low:c[1],high:c[2]}]))};
    const result=await sdk.runTransaction(ref,value=>value===null?room:undefined,{applyLocally:false});
    if(result.committed){state.room=null;attachRoom(code,client);return;}
  }
  throw new Error('Es konnte kein freier Raumcode erstellt werden.');
}
async function joinOnline(name,code,flag){
  if(!/^[A-Z0-9]{6}$/.test(code))throw new Error('Ein Raumcode hat genau 6 Zeichen.');
  const client=await getFirebase();const {auth,db,sdk}=client,uid=auth.currentUser.uid;
  const snapshot=await sdk.get(sdk.ref(db,`rooms/${code}`));
  if(!snapshot.exists())throw new Error('Raum nicht gefunden. Prüfe deinen Code.');
  const room=snapshot.val();
  if(room.kicked?.[uid])throw new Error('Du wurdest von diesem Raum ausgeschlossen.');
  if(!room.players?.[uid]){
    if(room.status!=='lobby')throw new Error('Dieses Spiel hat schon begonnen. Beitritt ist nur im Warteraum möglich.');
    const preview=previewPlayers(room);const red=preview.filter(p=>p.team==='red').length,blue=preview.filter(p=>p.team==='blue').length;
    const team=red<=blue?'red':'blue';
    await sdk.set(sdk.ref(db,`rooms/${code}/players/${uid}`),{name,joinedAt:Date.now(),team,slot:preview.filter(p=>p.team===team).length,flag:flagCode(flag)||'de'});
  }
  state.room=null;attachRoom(code,client);
}
function leaveRoom(){
  clearRoundUi();clearTimeout(state.timer);if(state.unsubscribe){state.unsubscribe();state.unsubscribe=null;}
  state.mode='home';state.room=null;state.me='';state.code='';state.privateValue=null;state.privateRoundId='';state.loadedSecretFor='';
  localStorage.removeItem('skala_room');history.replaceState(null,'',location.pathname);render();
}
async function autoRestore(){
  const code=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
  const saved=localStorage.getItem('skala_room');
  if(!firebaseConfigured||!saved||saved!==code)return;
  try {
    const client=await getFirebase();const snap=await client.sdk.get(client.sdk.ref(client.db,`rooms/${saved}`));
    if(snap.exists()&&snap.val().players?.[client.auth.currentUser.uid])attachRoom(saved,client);
  }catch(e){console.warn('Wiederaufnahme nicht möglich:',e);}
}

app.addEventListener('submit',event=>{
  const form=event.target;if(!['create-form','join-form','category-form','clue-form'].includes(form.id))return;
  event.preventDefault();
  void guarded(async()=>{
    if(form.id==='create-form'){const name=document.getElementById('create-name').value.trim();if(!name)return;localStorage.setItem('skala_name',name);localStorage.setItem('skala_profile_flag',savedFlag());await createOnline(name,savedFlag());}
    if(form.id==='join-form'){const name=document.getElementById('join-name').value.trim(),code=document.getElementById('join-code').value.trim().toUpperCase();if(!name)return;localStorage.setItem('skala_name',name);localStorage.setItem('skala_profile_flag',savedFlag());await joinOnline(name,code,savedFlag());}
    if(form.id==='category-form'){const name=document.getElementById('category-name').value.trim(),low=document.getElementById('cat-low').value.trim(),high=document.getElementById('cat-high').value.trim();if(name&&low&&high)await addCategory(name,low,high);}
    if(form.id==='clue-form'){const word=document.getElementById('clue-input').value.trim();if(word)await sendClue(word);}
  });
});
app.addEventListener('change',event=>{
  if(event.target.id==='demo-actor'){state.demoActor=event.target.value;state.me=state.demoActor;syncPrivateDemo();}
  if(event.target.id==='round-limit')void guarded(()=>setRoundLimit(Number(event.target.value)));
});
app.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action;
  if(action==='leave'){event.preventDefault();leaveRoom();return;}
  if(action==='demo'){startDemo();return;}
  if(action==='profile'){openProfile();return;}
  if(action==='copy'){
    const link=`${location.origin}${location.pathname}?room=${encodeURIComponent(state.code)}`;
    const write = navigator.clipboard?.writeText(state.mode==='demo'?state.code:link);
    if(write) write.then(()=>showToast(state.mode==='demo'?'Demo-Code kopiert':'Einladungslink kopiert!')).catch(()=>showToast(`Raumcode: ${state.code}`));
    else showToast(`Raumcode: ${state.code}`);
    return;
  }
  if(action==='select-guess'){state.selectedGuess=Number(button.dataset.number);render();return;}
  if(action==='guess') {const n=state.selectedGuess;void guarded(()=>sendGuess(n));return;}
  if(action==='remove-cat'){void guarded(()=>removeCategory(button.dataset.id));return;}
  if(action==='move-player'){void guarded(()=>movePlayer(button.dataset.id,button.dataset.team));return;}
  if(action==='kick-player'){void guarded(()=>kickPlayer(button.dataset.id));return;}
  if(action==='start'){void guarded(startGame);return;}
  if(action==='next'){void guarded(advanceRound);return;}
  if(action==='rescue-round'){const id=state.room?.turn?.id;if(id)void rescueRound(id);return;}
  if(action==='retry-secret'){void syncPrivateOnline(true);return;}
  if(action==='skip-broken'){void guarded(skipStuckRound);return;}
  if(action==='end'){if(confirm('Spiel wirklich beenden?'))void guarded(endGame);return;}
  if(action==='again'){void guarded(again);return;}
});

// The profile UI lives outside #app so live Firebase updates do not close it.
const profileLayer=document.getElementById('profile-layer');
profileLayer.addEventListener('click',event=>{
  if(event.target===profileLayer){closeProfile();return;}
  const btn=event.target.closest('[data-profile]');if(!btn)return;
  const action=btn.dataset.profile;
  if(action==='close'){closeProfile();return;}
  if(action==='select-flag'){
    state.profileDraft.flag=flagCode(btn.dataset.flag)||state.profileDraft.flag;
    updateFlagPicker();refreshProfileDraftPreview();return;
  }
  if(action==='random'){
    state.profileDraft.flag=FLAGS[Math.floor(Math.random()*FLAGS.length)][0];
    updateFlagPicker();refreshProfileDraftPreview();return;
  }
  if(action==='copycode'){void copyProfileValue(state.code,'Raumcode kopiert!');return;}
  if(action==='copyinvite'){void copyProfileValue(`${location.origin}${location.pathname}?room=${encodeURIComponent(state.code)}`,'Einladungslink kopiert!');return;}
});
profileLayer.addEventListener('input',event=>{
  if(event.target.id==='profile-name'){state.profileDraft.name=event.target.value;refreshProfileDraftPreview();}
  if(event.target.id==='profile-filter'){state.profileSearch=event.target.value;updateFlagPicker();}
});
profileLayer.addEventListener('submit',event=>{
  if(event.target.id==='profile-form'){event.preventDefault();void guarded(saveProfile);}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!profileLayer.hidden)closeProfile();});
async function copyProfileValue(value,message){
  try{await navigator.clipboard.writeText(value);showToast(message);}
  catch(_){showToast('Kopieren nicht möglich. '+value);}
}

render();void autoRestore();

  </script>
